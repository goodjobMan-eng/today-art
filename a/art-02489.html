<h1>민화 부채 만들기 (미국 초등학교 수업)</h1>
<p>보스턴의 한 초등학교에서 학부모가 어변성룡도·일월오봉도를 소개하고, 아이들이 밑그림 도안을 바탕으로 채색하고 색종이를 붙여 민화 부채를 만든 과정을 담은 브이로그입니다. 민화를 처음 접하는 아이들의 반응과 결과물을 볼 수 있습니다.</p>
