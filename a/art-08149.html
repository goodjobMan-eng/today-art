<h1>화려한 그러데이션 찍기 목판화</h1>
<p>두 가지 색 잉크로 그러데이션을 만들어 목판에 올려 찍는 방법을 다룹니다. 단색 찍기와 다른 주의점을 짚어 주고 실제 새기기와 찍기 과정도 보여 주어, 목판화를 한 단계 발전시키고 싶을 때 참고하기 좋습니다.</p>
