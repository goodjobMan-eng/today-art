<h1>색상환 눈 그리기</h1>
<p>눈 모양을 그리고 홍채 부분을 색상환으로 표현한 뒤, 눈썹과 속눈썹을 스케치하고 연필 명암을 면봉과 솜으로 문질러 완성하는 4학년 대상 수업입니다. 색과 명암 표현을 한 작품에서 함께 다룹니다.</p>
