<h1>색상환 눈 그리기</h1>
<p>눈 모양 안에 색상환을 담아 그리는 4학년 대상 미술 수업 영상이다. 설명란 정보는 없지만 제목으로 색상환과 눈 그림을 결합한 활동임을 알 수 있어, 색의 기초를 다루는 수업 후보로 살펴볼 만하다.</p>
