<h1>고흐 알아보고 「별이 빛나는 밤」 모래·색종이 꾸미기</h1>
<p>어린이를 위해 고흐의 생애를 캐릭터와 함께 유머 있게 소개하고, 끝부분에서 파란 도화지에 색종이 집, 모래 밭과 나무, 반짝이 밤하늘로 「별이 빛나는 밤」을 재해석하는 만들기를 보여 주는 독일어 영상입니다. 제작자가 학교 미술 시간에 보여 주어도 된다고 밝히고 있어 수업 도입에 쓰기 좋습니다.</p>
