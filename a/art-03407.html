<h1>기하학 도형으로 만드는 자동차 풍경 콜라주</h1>
<p>콜라주가 무엇인지와 기하학적 도형을 유치부~3학년 눈높이로 설명한 뒤, 색종이·신문·광고지를 도형으로 오려 배치하고 붙여 자동차가 있는 풍경 콜라주를 완성하는 영상입니다. 체크리스트와 틀이 있는 활동지가 함께 나와 담임교사의 콜라주 수업 도입 자료로 쓰기 좋습니다.</p>
