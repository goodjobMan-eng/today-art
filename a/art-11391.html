<h1>조선시대에서 온 고양이 그리기</h1>
<p>조선시대 옷과 소품을 걸친 고양이를 실루엣 도안에 그리고 색칠한 뒤 오려 붙여 그림 인형으로 완성하는 간편 미술 영상입니다. 짧은 영상이라 결과물을 미리 보여 주기 좋고, 원작자 블로그에서 도안을 받을 수 있습니다.</p>
