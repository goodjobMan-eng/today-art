<h1>목판화 새기기 ③ — 둥근칼로 얼굴 입체감 내기</h1>
<p>자화상 목판화를 예로 초등학생에게 조각칼 쓰는 법을 설명하는 시리즈의 세 번째 영상으로, 둥근칼로 얼굴 안쪽을 입체감 있게 파내는 과정을 다룹니다. 초등 미술(도공) 수업 실천을 정리한 사이트의 교사가 만든 영상이라 판화 단원 지도에 바로 활용하기 좋습니다.</p>
