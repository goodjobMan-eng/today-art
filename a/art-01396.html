<h1>스텐실로 부직포 앞치마 꾸미기</h1>
<p>알파벳·꽃·나비·하트 스텐실 도안으로 부직포 앞치마에 이니셜과 무늬를 찍어 나만의 앞치마를 완성하는 활동입니다. 스케치북에 먼저 연습한 뒤 앞치마에 옮기는 흐름이며, 결과물을 미술 시간 앞치마로 쓸 수 있습니다. 판매용 키트를 쓰는 유아 대상 영상입니다.</p>
