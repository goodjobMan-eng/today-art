<h1>입체 강아지 종이접기</h1>
<p>색종이 한 장으로 방석접기를 하고 꼬리와 몸통, 머리를 차례로 접은 뒤 네임펜으로 눈과 코를 그려 세워지는 입체 강아지를 완성하는 영상입니다. 채널에서 난이도를 쉬움으로 안내하고 있어 종이접기 경험이 적은 학급에도 부담이 적습니다.</p>
