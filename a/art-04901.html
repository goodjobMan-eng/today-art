<h1>태극기·무궁화 아가모그래프</h1>
<p>보는 각도에 따라 태극기와 무궁화가 번갈아 보이는 아가모그래프를 만드는 계기교육 활동입니다. 꽃잎에 색 단서 선을 넣은 도안이라 누구나 쉽게 색칠할 수 있고, 태극기의 의미도 함께 다룹니다. 같은 채널의 다른 아가모그래프(북극곰, 산타)와 주제가 다른 작품입니다.</p>
