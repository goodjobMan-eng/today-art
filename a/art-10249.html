<h1>대상과 손을 함께 보는 새로운 사생(크롬북)</h1>
<p>1인 1기기 화면에 대상을 비추며 그 위에 직접 그려, 대상과 손을 동시에 보면서 사생하는 저학년 수업 사례입니다. 구도를 깊이 고민하지 않고도 &#x27;보고 그리는&#x27; 경험을 쉽게 할 수 있게 해 줍니다.</p>
