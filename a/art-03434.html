<h1>알루미늄 포일 돋을새김 원형 장식</h1>
<p>원형 도안을 오려 양면테이프를 붙이고 끈과 입체 요소를 올린 뒤 알루미늄 포일을 씌워 도구로 세부를 눌러 새기고, 마커로 색칠하거나 검은 잉크를 바르고 닦아 무늬를 살리는 돋을새김(르푸세) 공예입니다. 반짝이는 금속 질감의 부조 장식이 나와 고학년 공예 활동으로 좋습니다.</p>
