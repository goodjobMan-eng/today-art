<h1>음악 듣고 선으로 표현하기 (1학년)</h1>
<p>아르헨티나 학교의 1학년 미술·음악 통합 원격 수업 영상으로, 음악을 듣고 느낀 것을 여러 가지 선으로 표현하는 활동입니다. 설명란에 준비물 안내는 없지만 제목과 수업 구성으로 활동 내용을 알 수 있어 저학년 선 표현 수업의 도입으로 참고하기 좋습니다.</p>
