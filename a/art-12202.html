<h1>빙글빙글 도는 종이 만화경 만들기</h1>
<p>여러 장의 색종이로 부품을 접어 이어 붙이면 계속 뒤집으며 돌릴 수 있는 만화경 장난감이 됩니다. 색을 다르게 하면 불꽃놀이처럼 보여 완성 후 놀이 시간이 즐겁습니다. 채널에서 더 천천히 설명한 개선판을 따로 안내하고 있습니다.</p>
