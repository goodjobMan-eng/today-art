<h1>&#x27;고마워&#x27; 낱말 만다라 그리기</h1>
<p>&#x27;고마워(GRAZIE)&#x27;라는 낱말을 원형 종이 판에 돌려 가며 반복해 쓰고 따뜻한 색 마커와 크레용으로 채워 회전 대칭 만다라를 완성하는 활동입니다. 말이 마음에 주는 힘을 주제로 한 미술 치료 성격의 활동으로, 6세 이상 누구나 쉽게 따라 할 수 있다고 안내합니다.</p>
