<h1>미술 공책 첫 장 꾸미기 (화려한 디자인)</h1>
<p>흘러내리는 물감 무늬 배경 위에 ART 글씨와 학용품 그림, 노트 태그를 더해 미술 공책 첫 장을 꾸미는 레터링 아이디어 쇼츠입니다. 베트남 레터링 채널의 짧은 영상으로, 학기 초 미술 공책이나 작품집 표지를 꾸밀 때 참고할 수 있습니다.</p>
