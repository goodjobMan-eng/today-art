<h1>마녀 모자 쓴 핼러윈 초승달 그리기</h1>
<p>마녀 모자를 쓰고 호박을 매단 초승달과 구름·별을 단계별로 따라 그리고 색칠하는 영상입니다. 장면별 시간표가 있어 단계마다 멈춰 가며 보여 주기 좋고, 단순한 도형에서 시작해 저학년도 부담 없이 따라 할 수 있습니다. 제작자 사이트에 핼러윈 그리기 아이디어 모음 페이지도 있습니다.</p>
