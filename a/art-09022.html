<h1>책 사이로 고개 내미는 여우 책갈피</h1>
<p>인쇄한 도안을 색칠하고 오려 붙여, 앞발이 책장에 걸리고 얼굴이 쏙 나오는 여우 책갈피를 만듭니다. 아버지의 날 선물로 소개되었지만 누구에게나 줄 수 있는 선물 만들기로 쓰기 좋고, 도안을 원작자 사이트에서 받을 수 있습니다.</p>
