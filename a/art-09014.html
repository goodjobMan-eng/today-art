<h1>앱으로 팟캐스트 배경 그림 디자인하기</h1>
<p>디지털 미술 수업으로, 학생들이 사진 편집 앱의 새 도구 세 가지를 활용해 학급 팟캐스트의 배경 그림을 만듭니다. 다른 앱이나 프로그램을 써도 되지만 기본 틀 크기는 지키도록 안내하며, 원작자는 6~7학년(초등 고학년) 대상이라고 밝혔습니다.</p>
