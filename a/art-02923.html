<h1>종이 산타 장화 만들기</h1>
<p>도안을 이용해 니콜라우스(산타) 장화를 종이로 만드는 활동으로, 여러 개 만들어 대림절 달력으로 꾸미는 방법도 소개한다. 공작 수업을 하는 교사 채널의 영상이라 학급 단위 크리스마스 만들기로 고르기 좋다.</p>
