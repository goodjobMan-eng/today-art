<h1>색종이로 만드는 일본풍 창살 액자(리스)</h1>
<p>색종이 여러 장으로 테두리와 창호지 느낌의 격자를 접어 일본풍 액자를 만들고, 배경과 보름달을 더해 완성하는 영상입니다. 달맞이뿐 아니라 계절 행사에 맞춰 안의 장식을 바꿀 수 있고, 목차가 자세해 긴 과정을 나눠 보기 좋습니다.</p>
