<h1>빛과 그림자로 만드는 그림자 조각(shade sculpture)</h1>
<p>주변의 물건을 세우고 빛을 비추어 생기는 그림자 모양을 작품으로 즐기는 조형 활동이다. 초등 미술 교사 연구 모임이 만든 영상으로, 정답 없이 스스로 시도해 보도록 이끄는 구성이다.</p>
