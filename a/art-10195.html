<h1>미술관이 소개하는 데칼코마니 기법</h1>
<p>요코하마 미술관 교육 담당자가 소장품에 쓰인 기법인 데칼코마니를 직접 시연하며 소개하는 영상입니다. 초현실주의 화가들이 이 기법을 작품에 활용했다는 배경까지 짧게 다루어, 표현 활동과 감상을 함께 엮기 좋습니다.</p>
