<h1>동백꽃과 부채로 꾸미는 설날 종이 장식</h1>
<p>빨강·하양 동백꽃과 꽃술, 잎을 종이접기로 만들고 검은 바탕지 위에 금색 부채 장식과 수제 끈(미즈히키), 새해 인사 택을 함께 붙여 설날 장식을 완성하는 24분짜리 영상입니다. 미즈히키는 축의 봉투를 재활용해도 된다는 안내가 있으며, 글루건을 쓰는 단계가 있습니다.</p>
