<h1>종이 직조로 패턴 디자인하기</h1>
<p>13×13 모눈종이에 사인펜으로 패턴을 먼저 디자인한 뒤, 색종이와 별접기 종이 띠를 엮어 그 무늬대로 짜고 비닐 커버를 씌워 마무리하는 종이 직조(베짜기) 활동입니다. 수학의 규칙성 학습과 연결되며, 원작자는 손재주보다 규칙적인 패턴을 만드는 것이 핵심이라 중학년 이상을 권합니다.</p>
