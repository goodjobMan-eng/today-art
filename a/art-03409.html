<h1>가나의 켄테 천 알아보기</h1>
<p>가나의 전통 직물인 켄테 천의 배경과 의미, 만드는 방법을 여러 예시와 함께 소개하는 내레이션 디지털 그림책이다. 원작자가 3학년 켄테 천 수업에서 실제로 쓰는 자료라 문화 이해와 패턴 디자인 수업의 도입으로 알맞다.</p>
