<h1>민화 상징 알아보고 민화 그리기</h1>
<p>민화에 담긴 상징의 뜻을 알아본 뒤, 한지에 민화 도안을 옮겨 그리고 동양화 물감으로 초벌 채색과 세부 묘사를 거쳐 화려한 민화를 완성하는 영상입니다. 감상과 표현을 한 흐름으로 다룰 수 있어 고학년 전통 미술 단원에 참고하기 좋습니다.</p>
