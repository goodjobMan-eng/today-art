<h1>비교 감상과 단독 감상 방법 익히기</h1>
<p>뭉크의 「절규」로 한 작품을 깊이 보는 단독 감상을, 청자와 분청사기 두 병으로 비교 감상을 해 보는 감상 방법 안내 영상입니다. 방패·칼 모양 활동지에 감상을 적어 완성하며, 여러 출판사 5~6학년 감상 단원과 연결됩니다.</p>
