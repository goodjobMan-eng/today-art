<h1>장미 스테인드글라스(OHP)</h1>
<p>OHP 필름을 이용해 빛이 비치는 장미 스테인드글라스를 만드는 활동입니다. 빛과 미술, 스테인드글라스의 개념을 함께 다룰 수 있어 5월 꽃 주제 수업에 좋습니다. 영상 설명란 첫 문장은 카네이션 꽃바구니로 되어 있으나 제목과 도안 페이지는 장미 스테인드글라스입니다.</p>
