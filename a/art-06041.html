<h1>숨은 그림처럼 섞이는 위장(의태) 미술</h1>
<p>자연의 위장(의태)이 무엇인지, 광고·패션과 시각 예술에서 어떻게 쓰이는지 소개한 뒤, 색종이·무늬 종이·물감으로 인물이나 사물이 주변 무늬에 숨어들게 표현하는 활동으로 이어집니다. 바탕과 형태, 질감, 무늬를 다룬 앞선 수업들과 연결되어 단원 마무리로 좋습니다.</p>
