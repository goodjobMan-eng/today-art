<h1>A4 한 장으로 접는 손잡이 바구니 상자</h1>
<p>A4 용지 한 장을 접어 상자 모양을 만들고 송곳으로 구멍을 내 손잡이를 달아, 과자나 사탕을 담을 수 있는 바구니를 완성합니다. 담임 교사가 학급 생일 선물(편지 묶음과 과자 바구니)을 준비하며 쓴 아이디어라 학급 행사와 잇기 좋습니다.</p>
