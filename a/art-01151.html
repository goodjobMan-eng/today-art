<h1>수채 번지기로 그리는 오로라</h1>
<p>투명 수채 물감의 번지기로 밤하늘의 오로라와 숲, 물에 비친 빛까지 담은 풍경화를 그리는 짧은 영상입니다. 3분 남짓으로 짧고 결과물이 화려해, 고학년 수채화 번지기 기법 도입 자료로 보여 주기 좋습니다. 채널은 중·고등 미술 태그도 함께 쓰므로 초등에서는 고학년에 맞습니다.</p>
