<h1>병뚜껑 원으로 그리는 수채 연잎</h1>
<p>물병 뚜껑을 대고 연필로 원을 그려 연잎 모양을 잡고, 수채로 연잎과 물 배경을 칠한 뒤 흰색 과슈로 마무리하는 짧은 영상입니다. 동그라미만 따라 그리면 되어 그리기를 어려워하는 학생도 부담 없이 따라 할 수 있습니다.</p>
