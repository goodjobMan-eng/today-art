<h1>양쪽으로 펼치는 작은 추석 입체 카드</h1>
<p>접는 선이 인쇄된 도안을 오려 접고 앞면에 추석 그림을 그려 칠한 뒤, 양쪽으로 펼치면 안쪽 인사말이 나타나게 만드는 작은 카드 영상입니다. 원작자 블로그의 무료 도안을 쓰면 준비 부담이 적어 명절 계기 수업에 바로 쓸 수 있습니다.</p>
