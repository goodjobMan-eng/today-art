<h1>일상 물건으로 만드는 그림자 아트</h1>
<p>스테이플러·가위·빗·숟가락 같은 물건에 빛을 비춰 생긴 그림자에 그림을 더해 전혀 다른 형상으로 바꾸는 그림자 아트를 보여 주는 짧은 영상이다. 후반에는 손과 소품만으로 춤 동작을 그림자로 연출하는 장면이 있어 빛과 그림자 수업의 도입 자료로 흥미를 끌기 좋다.</p>
