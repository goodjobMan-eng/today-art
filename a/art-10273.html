<h1>데칼코마니로 곤충 그리기</h1>
<p>물감을 도화지에 바로 짜고 반으로 접어 생긴 좌우대칭 모양을 곤충으로 발전시키는 그리기 활동이다. 화실 수업에서 1~6학년 어린이 작품까지 함께 보여 주어 학년별 결과물을 가늠하기 좋다.</p>
