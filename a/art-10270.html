<h1>빛과 그림자로 태어나는 형태(3·4학년 수업)</h1>
<p>재료를 조합하고 빛을 비추는 방법을 바꾸어 재미있는 그림자 모양을 만드는 조형 놀이를 실제 수업으로 보여 주는 교과서 출판사 영상입니다. 수업의 흐름과 아이들의 반응을 볼 수 있어 처음 이 제재를 하는 교사에게 도움이 됩니다.</p>
