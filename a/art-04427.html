<h1>필리핀 원주민 전통과 스페인 영향 미술 (5학년 음악·미술)</h1>
<p>필리핀 5학년 &#x27;음악과 미술&#x27; 3분기 1~2차시를 다룬 20분짜리 수업 발표 영상으로, 16~17세기 필리핀의 원주민 전통 미술과 스페인 영향을 받은 미술을 소개합니다. 문화 교류가 미술에 어떤 변화를 가져오는지 생각해 보는 감상 자료로 쓸 수 있습니다.</p>
