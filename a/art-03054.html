<h1>붓 종류 알고 써 보기</h1>
<p>둥근 붓, 납작붓, 고양이 혀 모양 붓, 부채붓 등 자주 쓰는 붓을 수채화·템페라·아크릴 같은 물 재료로 직접 써 보며 특징을 알아보는 영상이다. 회원용 전체 수업의 미리보기 편이지만 채색 단원 첫 시간에 도구 탐색 자료로 쓰기 좋다.</p>
