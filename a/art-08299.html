<h1>실루엣 안에 담는 풍경 콜라주</h1>
<p>종이 뒷면에 실루엣을 그리고 앞면에 잡지의 자연 사진(식물, 바다, 산, 동물 등)을 붙인 뒤 오려, 실루엣 모양 안에 풍경이 담기는 콜라주를 만드는 쇼츠입니다. 설명란에 활동 흐름이 정리되어 있어 수업으로 옮기기 쉽습니다.</p>
