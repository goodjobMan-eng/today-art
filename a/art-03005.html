<h1>창밖 풍경 사진으로 만드는 재활용 콜라주</h1>
<p>집 창문에서 찍은 사진을 투명 비닐에 옮겨 그린 뒤, 우유팩·과자 상자·전단지 같은 재활용 종이 조각으로 색을 채워 풍경을 완성하는 고학년 콜라주 수업이다. 주변 생활 쓰레기로 색을 모으는 과정이 재미있고 관찰과 색 탐색을 함께 경험할 수 있다.</p>
