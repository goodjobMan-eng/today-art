<h1>흔들흔들 반원 눈사람 종이 공작</h1>
<p>미리 오려 둔 반원·원·삼각형 종이 조각을 붙여 몸통을 구부리면 좌우로 흔들리는 입체 눈사람을 만들고, 얼굴과 모자·목도리를 그려 꾸미는 30초 길이의 영상입니다. 접기보다 붙이고 꾸미는 과정이 중심이라 저학년 겨울 만들기로 고르기 좋습니다.</p>
