<h1>수채 번지기로 그리는 털복숭이 검은 고양이</h1>
<p>수채 물감 번지기로 검은 고양이의 보송보송한 털 질감과 투명한 눈을 표현하는 짧은 영상입니다. 2분이 안 되는 짧은 시범이라 고학년 수채화 질감 표현 수업 도입에 보여 주기 좋습니다. 채널이 중·고등 미술 태그를 쓰므로 초등에서는 고학년에 맞습니다.</p>
