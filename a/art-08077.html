<h1>노을 풍경을 채운 SUNSET 레터링</h1>
<p>SUNSET 글자 도안 안을 물감으로 칠하고 노을 풍경을 그려 넣은 뒤 테두리를 마감하는 레터링 영상으로, 인도의 미술 급수 시험(Elementary·Intermediate)용으로 소개되었습니다. 글자와 그림을 하나로 엮는 디자인이라 포스터 글자 수업에 참고하기 좋습니다.</p>
