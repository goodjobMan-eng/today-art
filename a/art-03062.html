<h1>거꾸로 그리기: 수채화 거북이</h1>
<p>먼저 수채화로 색을 칠한 뒤 그 위에 선을 그려 귀여운 거북이를 완성하는 &#x27;거꾸로 그리기&#x27; 활동이다. 칠하고 나서 그리는 순서를 바꾸는 발상이 신선해, 그리기에 부담을 느끼는 학생도 즐겁게 참여할 수 있다.</p>
