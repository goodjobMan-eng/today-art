<h1>트리스켈 무늬 종이 공(페이퍼 글로브) 만들기</h1>
<p>트리스켈(세 갈래 소용돌이) 무늬 도안을 이어 붙여 입체 종이 공을 만드는 활동으로, 운영자가 7학년(초등 마지막 학년)과 실제로 한 수업입니다. 영상에서 그린 도안을 설명란 링크에서 무료로 받을 수 있습니다.</p>
