<h1>그림책 『나뭇잎 도둑』 가을 만들기 활동</h1>
<p>다람쥐와 바람이 나오는 가을 그림책을 읽은 뒤 낙엽을 모아 관찰하고, 잎과 나무 이름을 적는 도안을 채우고, 가을 나무 협동화를 만드는 이탈리아 영상입니다. 그림책 읽기와 야외 관찰, 모둠 작품을 묶어 계절을 다루고 싶을 때 참고하기 좋습니다.</p>
