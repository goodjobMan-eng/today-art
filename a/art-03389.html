<h1>맞춤선을 써서 찍는 다색 판화 찍기</h1>
<p>고양이·닭 그림 판에 브레이어로 잉크를 바르고 맞춤선이 그려진 안내 종이에 맞춰 색을 겹쳐 찍은 뒤, 남은 잉크로 고스트 프린트까지 얻는 과정을 시연한 영상입니다. 판화 수업의 찍기 차시 직전에 보여 주면 시행착오가 줄어듭니다.</p>
