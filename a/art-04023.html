<h1>생크림 꽃 쿠스다마 종이접기</h1>
<p>종이 유닛을 여러 개 접어 풀로 붙여 꽃 공(쿠스다마)을 만들고 리본과 진주 비즈로 장식하는 1분 길이의 짧은 영상입니다. 자세한 과정은 채널의 본편 영상에서 볼 수 있어, 쇼츠는 완성작을 보여 주며 동기를 높이는 데 쓰기 좋습니다.</p>
