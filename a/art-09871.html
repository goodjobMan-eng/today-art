<h1>오일파스텔로 입체적인 사과 그리기(밑색의 비밀)</h1>
<p>빨간 사과를 그리면서 파란색·노란색 밑색을 먼저 칠한 뒤 빨간색을 덮어 깊이 있는 색을 만드는 짧은 영상이다. 밑색에 따라 겉색이 달라지는 색채 원리를 보여 주어 고학년 정물 수업 도입에 좋다.</p>
