<h1>종이 조각 그림·네온 아트·설치 미술 중 골라 만들기</h1>
<p>종이 조각으로 만드는 그림, 선명한 색의 네온 느낌 그림, 설치 미술 세 가지 프로젝트를 소개하고 하나를 골라 만들게 하는 4~6학년 대상 수업 영상이다. 학생이 활동을 선택할 수 있어 수준 차이가 있는 고학년 학급에서 쓰기 좋다.</p>
