<h1>여름맞이 &#x27;여름이 왔어요&#x27; 만들기</h1>
<p>시원한 여름 분위기를 담은 만들기 도안으로 여름을 맞이하는 활동입니다. 기본 도안은 블로그에서, 프리미엄 도안은 별도 페이지에서 받을 수 있습니다. 같은 채널의 다른 여름 작품(유리병, 반딧불이 등)과는 다른 작품입니다.</p>
