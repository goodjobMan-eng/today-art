<h1>동글동글 공벌레 종이접기</h1>
<p>색종이 한 장으로 기본선을 접은 뒤 더듬이와 머리, 등껍질 주름을 차례로 만들어 입체 공벌레로 모양을 잡는 영상입니다. 주름이 겹겹이 살아나는 결과물이 인상적이라 작은 생물 관찰 수업과 잇기 좋습니다.</p>
