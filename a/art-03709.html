<h1>「겨울 꿈」 콜라주 그림 (1~2학년)</h1>
<p>겨울잠 자는 곰과 꿈속 풍경을 그리고 칠한 뒤 이불을 꾸며 오려 조립하는 「겨울 꿈」 작품의 제작 과정을 보여 주는 독일 초등 교사 채널의 영상입니다. 복사용 도안, 도입 이야기, 단계별 안내, 평가 제안까지 갖춘 수업 자료가 별도로 마련되어 있어 수업 준비에 도움이 됩니다.</p>
