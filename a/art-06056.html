<h1>&#x27;쓸모없는 참나무&#x27; 이야기와 나무 왕관 만들기</h1>
<p>나무의 날을 맞아 그림과 함께 &#x27;쓸모없는 참나무&#x27; 이야기를 들려주고, 나무가 주는 고마움을 생각해 본 뒤 나무 모양 왕관을 빠르게 만드는 짧은 만들기로 마무리하는 영상입니다. 이야기와 생각 나누기, 만들기가 한 영상에 담겨 있어 기념일 수업으로 쓰기 좋습니다.</p>
