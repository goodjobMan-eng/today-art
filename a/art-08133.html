<h1>점토 캐릭터에 꽃종이로 색 입히기</h1>
<p>점토로 만든 크레용 신짱 캐릭터에 물감 대신 얇은 꽃종이(お花紙)를 입혀 색을 내는 쇼츠입니다. 운영자 댓글에서 꽃종이를 겹치거나 섞어 피부색을 맞춘 과정을 이야기해, 물감 없이 점토 작품에 색을 내는 색다른 방법을 보여 줍니다.</p>
