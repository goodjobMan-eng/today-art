<h1>새겨 나가며 색을 겹치는 목판화(소거 판화)</h1>
<p>한 판을 여러 번 새기고 찍으며 색을 겹쳐 가는 &#x27;새겨 나가기&#x27; 목판화의 원리를 애니메이션으로 쉽게 풀고 실제 제작 과정을 보여 주는 영상입니다. 어렵게 느껴지는 기법을 이해시키는 데 강점이 있으며, 원작자 사이트에 수업 실천 기록도 있습니다.</p>
