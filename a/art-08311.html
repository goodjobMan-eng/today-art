<h1>지점토로 만드는 반짝이 장미 장식</h1>
<p>색 지점토를 섞어 반죽한 뒤 꽃잎을 말아 장미를 만들고, 면봉으로 줄기를 표현하고 잎과 받침을 붙여 글리터로 꾸미는 쇼츠입니다. &#x27;말기&#x27;라는 쉬운 동작으로 꽃 모양이 나와 저학년도 성취감을 느끼기 좋습니다.</p>
