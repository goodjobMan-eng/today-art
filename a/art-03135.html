<h1>펭귄 실루엣 마스킹 수채화</h1>
<p>펭귄 도안을 오려 도화지에 테이프로 붙이고 주변 배경을 수채 물감으로 칠한 뒤 도안을 떼어 흰 실루엣을 남기고, 불투명 흰 물감으로 마무리하는 활동입니다. 도안을 떼어 낼 때 모양이 드러나는 재미가 있는 저학년 채색 수업입니다.</p>
