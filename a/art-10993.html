<h1>호주 원주민 점 그림 알아보기 디지털 그림책</h1>
<p>호주 원주민의 점 찍기 기법과 전통, 파푸니아 툴라 미술가들을 내레이션과 함께 소개하는 디지털 그림책 영상입니다. 초등 미술 교사가 실제 세계 미술 단원에서 쓰는 자료로, 점 그림 활동 전 도입으로 알맞습니다.</p>
