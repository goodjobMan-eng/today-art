<h1>영어로 배우는 색 (CLIL 미술)</h1>
<p>영어로 진행하는 초등 CLIL 미술 수업 영상으로, 삼원색과 이차색, 따뜻한 색과 차가운 색을 소개하고 고흐의 「별이 빛나는 밤」과 마티스의 「붉은 조화」를 짧게 감상한다. 색 공부와 영어를 함께 엮고 싶을 때 쓰기 좋다.</p>
