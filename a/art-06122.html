<h1>오려 붙이는 히나 인형 세트</h1>
<p>꽃(벚꽃·귤꽃), 등불, 히시모치 떡, 인형 얼굴과 몸까지 히나마쓰리 장식 세트를 100엔숍 재료로 오려 붙여 만드는 약 4분 영상입니다. 구간이 나뉘어 있어 필요한 부분만 골라 보여 주기 편합니다.</p>
