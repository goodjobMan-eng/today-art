<h1>색종이 모자이크로 꾸미는 달팽이</h1>
<p>달팽이 윤곽 도안에 풀칠하고 잘게 자른 색종이 조각을 붙여 껍데기를 채운 뒤, 달팽이 모양으로 오려 사인펜과 크레파스로 꾸미는 짧은 놀이 영상입니다. 운영자 댓글에 도안 출처 영상이 안내되어 있어 같은 도안으로 활동을 준비할 수 있습니다.</p>
