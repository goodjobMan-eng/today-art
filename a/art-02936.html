<h1>음악을 듣고 그리는 마음챙김 드로잉</h1>
<p>호주 미술 교사가 준비한 음악을 들으며 빠르기와 분위기를 선과 색으로 그려 보는 안내형 활동이다. 모든 연령에 맞는 마음챙김 활동으로 소개되어 미술·음악 통합 수업이나 학기 초 긴장 풀기 활동으로 고르기 좋다.</p>
