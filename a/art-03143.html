<h1>종이 연극(가미시바이) 무대 만들고 공연하기</h1>
<p>상자나 골판지로 종이 연극 무대를 만들고, 조사한 추억의 놀이 이야기를 그림과 글 장면으로 준비해 공연하는 페루 5~6학년 미술·문화 수업 영상입니다. 이야기 구성과 무대 만들기, 발표를 함께 다룰 수 있어 고학년 프로젝트로 좋습니다.</p>
