<h1>수국 벽면 장식과 꽃 공, 투명 물방울 장식</h1>
<p>색종이와 얇은 꽃종이로 가볍고 화사한 수국을 만들어 벽면 장식과 매다는 꽃 공으로 꾸미고, 클리어 파일로 반짝이는 물방울 장식까지 더하는 음성 해설 영상입니다. 여럿이 함께 만들어 학교에 장식하기 좋다고 소개된 작품입니다.</p>
