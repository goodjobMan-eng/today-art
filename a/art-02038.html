<h1>휴지 접어 그리고 펼치는 무늬 놀이 (점·점·팍!)</h1>
<p>교육청이 학습 영상 예시로 만든 저학년 미술 영상으로, 휴지를 접어 색연필로 무늬를 그린 뒤 펼치면 반복된 예쁜 무늬가 나타나는 놀이를 다룹니다. 2분 이내로 짧아 수업 시작에 바로 보여 주기 좋습니다.</p>
