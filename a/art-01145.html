<h1>찢은 종이로 만드는 초현실 콜라주</h1>
<p>종이를 손으로 아무렇게나 찢고, 찢어진 조각에서 떠오르는 모양(무지개, 집, 악어 등)을 찾아 작품으로 완성하는 콜라주 활동입니다. 우연에서 상상을 끌어내는 활동이라 그리기에 자신 없는 학생도 즐겁게 참여할 수 있고, 4세부터 가능하다고 안내합니다.</p>
