<h1>풍경화 색칠 세 가지 요령(학생 시청용)</h1>
<p>철길이 있는 풍경 밑그림을 수채화로 색칠하는 과정을 세 가지 요령으로 보여 주는 고학년 학생 시청용 영상으로, 색칠을 어려워하는 아이들을 위해 만들었다. 오랜 경력 교사가 연수 요청을 받아 수업용으로 다시 엮었다.</p>
