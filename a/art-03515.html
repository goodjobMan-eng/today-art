<h1>과일 부채 만들기</h1>
<p>과일 도안 종이를 오려 접어 붙인 뒤 아이스크림 막대로 손잡이를 달아 과일 모양 종이 부채를 완성하는 짧은 영상입니다. 완성한 부채는 실제로 부칠 수 있으며, 운영자 댓글에 따르면 도안을 인스타그램·블로그에서 나눔하고 천천히 만드는 영상도 채널에 있습니다.</p>
