<h1>손으로 칠한 종이로 꿀벌 콜라주</h1>
<p>먼저 콜라주용 색종이를 직접 칠해 만든 뒤 그것을 오려 귀여운 꿀벌들을 꾸미는 활동이다. 5세 이상 어린이를 대상으로 해 저학년에 알맞고, 종이를 직접 만드는 과정이 들어 있어 재료 탐색 경험도 함께 할 수 있다.</p>
