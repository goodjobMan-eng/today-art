<h1>파스텔로 그리는 비눗방울 풍경</h1>
<p>알록달록한 파스텔로 비눗방울이 떠다니는 봄 풍경을 표현하고, 도안 속 아이 캐릭터를 색연필로 꾸며 완성하는 파스텔화입니다. 색칠 방법에 따라 캐릭터를 남자아이나 여자아이로 바꿀 수 있어 누구나 자기 모습처럼 꾸밀 수 있고, 도안이 무료로 제공됩니다.</p>
