<h1>달걀 껍데기 모자이크 &#x27;기적의 주&#x27; 액자</h1>
<p>카드보드 테두리에 달걀 껍데기를 붙여 모자이크를 만들고 파랑·빨강 템페라 물감과 금색 글리터로 꾸민 뒤 &#x27;기적의 주&#x27; 성화 인쇄물을 붙여 액자를 완성하는 페루 2학년 대상 수업 영상입니다. 지역 종교 행사와 관련된 소재라 우리 교실에서는 다른 그림으로 바꿔 쓰는 것이 좋습니다.</p>
