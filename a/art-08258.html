<h1>겹친 원으로 그리는 수채 곡선 패턴</h1>
<p>테이프 롤로 겹치는 원을 여러 개 그리고 칸마다 수채로 칠한 뒤, 선이 만나는 부분을 검은 펜으로 둥글게 다듬어 완성하는 뉴로그래픽풍 패턴 쇼츠입니다. 원만 따라 그리면 되어 그리기를 어려워하는 학생도 쉽게 참여할 수 있습니다.</p>
