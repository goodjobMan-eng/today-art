<h1>동물 가면 만들기(겨울나기 홍보)</h1>
<p>동물 얼굴을 그려 색칠하고 눈 부분을 오려 낸 뒤 나무젓가락 손잡이를 붙여 손에 들고 쓰는 동물 가면을 만드는 2학년 대상 영상입니다. 동물들의 겨울나기를 돕는 홍보 활동과 연계해 통합교과 겨울 주제로 만들기와 역할 놀이를 함께할 수 있습니다.</p>
