<h1>두려움 감정 알기와 뭉크 &#x27;절규&#x27; 점토로 표현하기</h1>
<p>두려움이라는 감정을 아이들 눈높이로 알아본 뒤, 뭉크의 &#x27;절규&#x27; 배경을 채색하고 그 위에 비명 지르는 자신의 모습을 점토로 만들어 붙이는 감정 교육·미술 연계 영상입니다. 사회정서 교육과 명화 감상을 함께 하고 싶을 때 좋습니다.</p>
