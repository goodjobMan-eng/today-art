<h1>소금 기법으로 그리는 수채화 수박</h1>
<p>수채 물감으로 여름 과일 수박을 그리는 쇼츠로, 운영자 댓글에서 소금을 써서 무늬를 내는 기법을 다루고 있음을 알 수 있습니다. 소금이 물감을 빨아들이며 생기는 질감을 보여 주어 수채화 효과 실험 수업의 도입으로 좋습니다.</p>
