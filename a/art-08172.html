<h1>마블링 물감을 입힌 클레이 도넛 장식 액자</h1>
<p>클레이로 빚은 도넛 모양 장식을 물 위에 띄운 마블링 물감에 담갔다 꺼내 무늬를 입힌 뒤, 네 칸으로 나뉜 사각 틀에 붙여 완성하는 수업 장면입니다. 종이가 아닌 입체물에 마블링을 입히는 응용이라 마블링 수업을 변형할 때 참고가 됩니다.</p>
