<h1>소원 감 만들기(명절 미술)</h1>
<p>감 모양 작품에 소원을 담아 만든 뒤 배경 나뭇가지 도안을 색칠하고 그 위에 소원감을 붙여 완성하는 명절 미술 영상입니다. 짧은 영상이라 추석 계기 교육 도입에 쓰기 좋고 원작자 블로그에서 도안을 받을 수 있습니다.</p>
