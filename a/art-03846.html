<h1>반 고흐 「별이 빛나는 밤」 단원 수업 운영 안내</h1>
<p>초등 미술 교사가 1학년 대상 4차시 「별이 빛나는 밤」 단원을 하늘 색 탐색, 알루미늄 호일에 물감을 펴 바른 하늘 찍기, 검은 종이 스카이라인과 노란 창문 콜라주, 전시와 자기 평가까지 어떻게 운영하는지 설명하는 영상입니다. 학생용보다 교사용 수업 준비 자료로 가치가 큽니다.</p>
