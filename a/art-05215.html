<h1>해태와 봉황 그리기(한국의 미)</h1>
<p>우리 전통 상상 동물인 해태와 봉황을 구름 배경과 함께 그리는 &#x27;한국의 미&#x27; 활동으로, 인기 애니메이션의 전통 소재와 연결해 흥미를 끕니다. 원작자가 구름을 OHP 필름에 그려 가위질을 줄인 방법과 일반 마커만 있을 때의 대안을 함께 알려 줍니다.</p>
