<h1>고무줄로 무늬 내는 쪽빛 손수건 염색</h1>
<p>직물 박물관이 초등학생 체험용으로 만든 쪽(藍) 염색 손수건 무늬 내기 영상입니다. 꽃무늬, 큰 꽃무늬, 줄무늬를 고무줄 묶기로 만드는 방법을 나누어 보여 주어 학생이 원하는 무늬를 고르기 쉽습니다.</p>
