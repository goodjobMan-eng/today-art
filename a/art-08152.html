<h1>모델링 페이스트로 만드는 지판화(콜라그래프)</h1>
<p>판 위에 모델링 페이스트로 질감을 만들어 찍어 내는 콜라그래프(지판화)를 짧게 소개하는 판화 공방 영상이다. 종이뿐 아니라 천·레이스·사포처럼 얇은 소재도 판 재료가 될 수 있다는 점을 알려 주어 질감 판화 수업 아이디어를 얻기 좋다. 축약본이라 자세한 과정은 채널의 다른 영상을 보도록 안내한다.</p>
