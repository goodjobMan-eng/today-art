<h1>주름 접어 만드는 겹꽃 모양 종이 장식(쇼츠)</h1>
<p>광택 색종이를 주름 접고 오려 붙인 뒤 펼쳐 겹꽃 모양 입체 장식을 만들고 가운데를 구슬로 꾸미는 50초 쇼츠입니다. 마무리에 글루건을 쓰므로 교실에서는 교사가 붙여 주거나 풀로 바꿔 운영해야 합니다.</p>
