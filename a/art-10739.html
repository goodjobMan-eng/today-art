<h1>둥근 색종이로 돌아가는 원 모빌 만들기</h1>
<p>둥근 색종이를 이어 붙여 돌리면 공 모양이 보이는 원 모빌을 만드는 수학·미술 융합 활동입니다. 교사가 1·2학년 수학의 원과 입체도형 단원에서 실제로 운영했고, 국어와 연계해 여섯 글자 문장을 써 넣는 아이디어도 담겨 있습니다.</p>
