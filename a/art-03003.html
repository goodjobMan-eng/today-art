<h1>여러 재료로 평면 작품 구성하기</h1>
<p>여러 가지 재료를 써서 자신만의 생각을 담은 평면 작품을 구성하는 4학년 원격 수업 방송이다. 파스텔, 아크릴 물감, 바로크 미술, 벨라스케스 작품 감상 영상을 함께 활용하는 구성이라 감상과 표현을 엮는 수업 참고 자료가 된다.</p>
