<h1>크롬북으로 색칠 미리 해 보기(이미지 스케치)</h1>
<p>실제로 색을 칠하기 전에 크롬북 그리기 도구로 여러 배색을 시험해 보고 마음에 드는 색을 정하는 저학년용 수업 사례다. 다시 칠하기가 쉬운 디지털의 장점을 활용해 색칠 실패에 대한 걱정을 줄여 준다.</p>
