<h1>수국 만들고 그리기: 수채 혼색 (3·4학년)</h1>
<p>도화지 뒷면에 수국 도안을 인쇄해 두 가지 색을 섞어 꽃을 칠하고, 실제 잎을 보며 잎 색을 만들고, 실 튕기기로 비를 표현하는 장마철 그림입니다. 무료 도안이 제공되고 완성작을 모으면 수국 벽면이 됩니다.</p>
