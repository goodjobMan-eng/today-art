<h1>카네이션 봉투에 넣는 효도 쿠폰 카드</h1>
<p>양면 색종이로 봉투를 접고 줄기를 오린 뒤 카네이션 꽃을 접어 붙여, 그 안에 감사 편지와 효도 쿠폰을 넣는 어버이날·스승의날 카드입니다. 도안 없이 색종이와 흰 종이만으로 만들 수 있고, 쿠폰 내용을 정하며 감사를 행동 약속으로 바꿔 볼 수 있습니다.</p>
