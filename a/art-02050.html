<h1>동화 「모치모치나무」 장면 그리기</h1>
<p>이야기 「모치모치나무」의 장면을 크레파스와 물감으로 나타내며, 나무를 그리고 배경을 채색한 뒤 인물 실루엣을 더해 완성하는 과정을 교사의 교재 연구용으로 빠르게 보여 주는 영상입니다. 같은 채널에 학생용 설명 슬라이드 시리즈도 있어 수업 준비 흐름을 잡기 좋습니다.</p>
