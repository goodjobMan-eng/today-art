<h1>주름지 받침으로 빨리 만드는 수국</h1>
<p>주름지(お花紙)로 폭신한 받침을 만들고 색종이 꽃을 접고 오려 붙이는 수국 만들기입니다. 꽃을 많이 만들 필요가 없어 시간이 적게 들도록 고안했으며, 받침과 꽃 색을 다르게 하면 꽃이 돋보입니다.</p>
