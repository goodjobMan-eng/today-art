<h1>하트가 보이는 딸기 단면 수채화</h1>
<p>자른 딸기 단면 안쪽에 하트 모양이 보이도록 형태를 그리고 색을 채운 뒤 꼭지와 잎을 그려 10분 안에 완성하는 수채화 영상입니다. 짧은 시간에 완성되는 귀여운 과일 소재라 수채화 첫 작품으로 알맞습니다.</p>
