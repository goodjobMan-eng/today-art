<h1>코일로 무늬 넣는 점토 그릇 만들기</h1>
<p>종이 그릇을 틀로 삼아 여러 모양의 코일을 채워 장식 겸 실용 그릇을 만드는 점토 수업이다. 한 차시에 끝나도록 구성되어 있고 준비와 정리가 간편해, 가마가 있는 학교의 고학년 점토 수업으로 고려할 만하다.</p>
