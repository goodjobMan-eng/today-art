<h1>손가락 지렁이가 튀어나오는 깜짝 상자</h1>
<p>작은 상자 바닥에 구멍을 내고 고무장갑 손가락을 끼워 꾸민 뒤, 상자를 열면 손가락을 움직여 지렁이가 튀어나오게 하는 장난 상자를 만드는 영상이다. 장난스러운 결과물이 웃음을 주고, 만우절이나 친구 이벤트에 활용하기 좋다.</p>
